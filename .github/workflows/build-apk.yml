name: Build PSSAB Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP proyek tidak ditemukan di repositori."
            exit 1
          fi
          echo "ZIP yang digunakan: $ZIP_FILE"
          mkdir -p android-project
          unzip -oq "$ZIP_FILE" -d android-project
          echo "Daftar file proyek:"
          find android-project -maxdepth 6 -type f | head -100

      - name: Build debug APK
        run: |
          cd android-project/pssab_native_work
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSSAB-Android-APK
          path: android-project/pssab_native_work/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
