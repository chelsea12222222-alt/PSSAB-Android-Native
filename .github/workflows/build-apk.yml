name: Build PSSAB Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project archive
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir source
          unzip -q "PSSAB-Android-Native-Starter (1).zip" -d source
          echo "=== Project files ==="
          find source -maxdepth 4 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \)

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x $(find source -name gradlew -type f | head -n 1)
          cd "$(dirname "$(find source -name gradlew -type f | head -n 1)")"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PSSAB-debug-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
