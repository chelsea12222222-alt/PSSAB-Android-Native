
name: Build PSSAB Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q "PSSAB-Android-Native-Starter (1).zip" -d android-project
          echo "Isi proyek:"
          find android-project -maxdepth 4 -type f | head -80

      - name: Build debug APK
        run: |
          cd android-project/pssab_native_work
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSSAB-Android-APK
          path: android-project/pssab_native_work/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
